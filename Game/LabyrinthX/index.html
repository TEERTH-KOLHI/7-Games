<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabyrinthX - Maze Escape</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <img src="LabyQuest-nb.png" alt="LabyrinthX Logo" id="logo">
  </header>

  <div class="game-instruction">
    <span>🧭 Use <strong>Arrow keys</strong> or <strong>WASD</strong> to reach the red exit 🏁</span>
  </div>
  
  <main>
    <div id="maze-container"></div>
    <div id="controls">
      <div class="control-group">
        <label for="size">📐 Size:</label>
        <input type="number" id="size" value="21" min="5" max="51" step="2">
      </div>
      <button id="generate">🎲 New Maze</button>
      <button id="solve">💡 Show Solution</button>
    </div>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
