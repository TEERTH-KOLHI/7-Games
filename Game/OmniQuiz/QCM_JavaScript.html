<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniQuiz - Gamely Challenge</title>
  <link rel="stylesheet" href="style.css">
  <!-- GSAP for smooth animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- 🟢 Intro Screen with Logo -->
  <div class="intro-screen">
    <img src="./quiz-nb.png" alt="OmniQuiz Logo" class="quiz-logo">
    <button class="start-btn">⚡ Start the Challenge</button>
  </div>

  <!-- 🎯 Fixed Logo Container -->
  <div class="quiz-logo-container hidden">
    <img src="./quiz-nb.png" alt="OmniQuiz Logo" class="quiz-logo-fixed">
  </div>

  <!-- 🎯 Quiz Container -->
  <div class="quiz-container hidden" id="quiz">
    <div class="quiz-header">
      <div class="badge-wrapper"><span class="question-badge" id="question-badge">Question 1 / 5</span></div>
      <h2 id="question">Question text</h2>
      <ul>
      <!-- Text Input -->
      <input type="text" id="text-input" class="text-input hidden" placeholder="Type your answer here...">

      <!-- True/False Buttons -->
      <div class="true-false-container hidden">
        <div id="true-false-options">
            <button class="true-false-btn" data-value="true">True</button>
            <button class="true-false-btn" data-value="false">False</button>
        </div>
      </div>

      <!-- Multiple Choice Options -->
      <ul id="choices">
          <li class="quiz-option">
              <input type="radio" name="answer" id="a" class="answer">
              <label for="a" id="a_text">Option A</label>
          </li>
          <li class="quiz-option">
              <input type="radio" name="answer" id="b" class="answer">
              <label for="b" id="b_text">Option B</label>
          </li>
          <li class="quiz-option">
              <input type="radio" name="answer" id="c" class="answer">
              <label for="c" id="c_text">Option C</label>
          </li>
          <li class="quiz-option">
              <input type="radio" name="answer" id="d" class="answer">
              <label for="d" id="d_text">Option D</label>
          </li>
      </ul>
    </div>
    <button id="submit" class="submit-btn">Submit & Next →</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
